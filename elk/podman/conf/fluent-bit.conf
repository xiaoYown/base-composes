# fluent-bit 主配置 (build 时 COPY 进镜像: podman machine 挂载约束下不能 bind mount, 且发行版镜像无 shell 不能运行时落盘)
# 链路: 三入口 (tag logs.file|http|otlp) -> lua 归一 -> out_http 直写 clickhouse
# ${FB_*} 由 fluent-bit 自身 env 插值展开 (compose 侧注入, 不经 compose 插值)
[SERVICE]
    Flush         1
    Log_Level     info
    storage.path  /fluent-bit/tail_db

# 文件入口: 偏移 DB 持久化防重采; virtiofs 上 inotify 不传播, 轮询模式 + 5s 扫描
[INPUT]
    Name              tail
    Path              /var/log/apps/*.log,/var/log/apps/*/*.log
    Tag               logs.file
    Path_Key          file
    Parser            json_line
    DB                /fluent-bit/tail_db/tail.db
    Inotify_Watcher   false
    Refresh_Interval  5
    Mem_Buf_Limit     64MB
    Skip_Long_Lines   On

# 应用直推入口: 每行一个 JSON 对象 (vector 8686 同位替换)
[INPUT]
    Name          http
    Tag           logs.http
    Port          8686

# OTLP 遥测入口: OTel SDK 标准 OTLP/HTTP (默认 4318; 仅 logs 信号, traces/metrics 未接)
[INPUT]
    Name  opentelemetry
    Tag   logs.otlp

# 归一清洗 -> logs 表列结构 (message/level 粗判/source 文件名/ingress 标记)
[FILTER]
    Name    lua
    Match   logs.*
    script  /fluent-bit/etc/normalize.lua
    call    normalize

# 直写 clickhouse: 发行版无 clickhouse 输出插件, 用 http 插件发 JSONEachRow
# URI 是编码后的 INSERT 语句 (best_effort 解析 RFC3339 时间戳 + 容忍杂字段); json_lines 每行一 JSON 正合 JSONEachRow
[OUTPUT]
    Name         http
    Match        logs.*
    Host         clickhouse
    Port         8123
    URI          /?query=INSERT%20INTO%20db_logs.logs%20SETTINGS%20date_time_input_format%3D%27best_effort%27%2C%20input_format_skip_unknown_fields%3D1%20FORMAT%20JSONEachRow
    Format       json_lines
    http_user    ${FB_CH_USER}
    http_passwd  ${FB_CH_PASSWORD}
    compress     gzip
    Retry_Limit  False
