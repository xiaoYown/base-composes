# fluent-bit: tail 宿主日志目录 -> forward 送 vector (compose: fluent-bit 服务)
[SERVICE]
    Flush         1
    Log_Level     info
    storage.path  /fluent-bit/tail_db

# virtiofs 上 inotify 不传播: 轮询模式 + 5s 扫描
[INPUT]
    Name              tail
    Path              /var/log/apps/*.log,/var/log/apps/*/*.log
    Tag               logs
    Path_Key          file
    DB                /fluent-bit/tail_db/tail.db
    Inotify_Watcher   false
    Refresh_Interval  5
    Mem_Buf_Limit     64MB
    Skip_Long_Lines   On

# 整数时间戳 (vector fluent source 不认 EventTime); 本配置格式不支持行内注释
[OUTPUT]
    Name             forward
    Match            *
    Host             vector
    Port             24224
    Time_as_Integer  true
