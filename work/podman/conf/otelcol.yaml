# otelcol: OTLP 遥测网关 (compose: otelcol 服务)
# 接收 OTel SDK 标准 OTLP (4317 gRPC / 4318 HTTP) -> clickhouse exporter 写 db_logs.otel_logs
# 表由 exporter 自动创建管理 (OTel 标准列: Timestamp/TraceId/SpanId/SeverityText/Body/ResourceAttributes...)
# ${CLICKHOUSE_*} 由 otelcol 原生 env 插值展开
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    username: ${CLICKHOUSE_USER}
    password: ${CLICKHOUSE_PASSWORD}
    database: db_logs
    logs_table_name: otel_logs
    ttl: 720h    # 30 天, 同 db_logs.logs 的保留期
    retry_on_failure:
      enabled: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [clickhouse]
