# 工作中间件聚合 (podman): skillsui-knowanchor + light-kb 本地开发共用一套, 不再分多个 compose 分组.
# 迁自 (应用本体不进本分组, 仍在各自仓库 compose 里跑):
#   - agent-os/skillsui-knowanchor/.deploy/podman/compose.yaml  -> postgres / mysql / redis (原项目名 podman)
#   - agent-os/light-kb/.deploy/podman/compose.yaml             -> rocketmq 本地栈 (原项目名 light-kb)
# 数据卷沿用原卷名 (podman_ 前缀是原项目名残留, 为无缝继承旧数据不改名):
#   pg: db_default (knowanchor) + db_light_kb (light-kb) 共用实例
#   mysql: knowanchor 业务库 (db_default), root 免密
#   rocketmq: job-task / job-result topic 预建, proxy grpc 8081 对宿主发布
#   日志栈: fluent-bit -> vector -> clickhouse (db_logs.logs) + grafana 查询; 宿主 bind 数据统一放 data/
# 通用账号: pg / mysql 统一 admin (各项目共用, 密码在同目录 .env); 任何 db_name 一律 db_ 前缀
# 连接方式: 宿主进程 127.0.0.1:<port>; 其他 compose 分组的容器用 host.containers.internal:<port>
#   (分组间服务名不互通; 分组内如本文件注释中 pg_isready 用的都是服务名)
# 密钥只进同目录 .env (不入 git).
# machine 重建 (数据卷需先 export, 见 podman volume export/import):
#   podman machine init projects --memory 6144 --cpus 5 \
#     -v /Users:/Users -v /private:/private -v /var/folders:/var/folders \
#     -v ~/.config/containers:/etc/containers -v /Volumes/Projects-01:/Volumes/Projects-01
#   (-v 显式传参为全集覆盖, 缺一项对应共享即失效)
name: work

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16    # postgres + 预装 pgvector 扩展 (knowanchor pgvector 后端用)
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-127.0.0.1}          # 连接信息随容器自带 (podman exec env 可查); 容器间互连用服务名 postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在同目录 .env 配置}
      POSTGRES_DB: ${POSTGRES_DB:-db_default}    # 仅首次初始化生效; 库内其他库 (如 db_light_kb) 不受影响
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: docker.io/library/mysql:8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_HOST: ${MYSQL_HOST:-127.0.0.1}                # 连接信息随容器自带 (podman exec env 可查); 容器间互连用服务名 mysql
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在同目录 .env 配置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_default}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  # ---- RocketMQ 5.x 本地栈 (light-kb): nameserver + broker + proxy (grpc 对宿主发布) ----
  # 端口/JVM 堆/topic 清单走同目录 .env (ROCKETMQ_* / MQ_TOPICS);
  # broker 内部约定 (brokerIP1 = 服务名 / listenPort 10911 / 集群名) 是分组内契约, 保持硬编码勿 env 化.
  # 应用侧连接: MQ_ENDPOINT = 127.0.0.1:$ROCKETMQ_PROXY_PORT (容器间 host.containers.internal)
  rocketmq-namesrv:
    image: docker.io/apache/rocketmq:5.3.2
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "${ROCKETMQ_NAMESRV_HEAP:--Xms256m -Xmx256m -Xmn128m}"
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"

  # broker 配置进程内生成 (内容与 docker 形态的 rocketmq/broker.conf 一致, 勿漂移):
  # brokerIP1 须为服务名供 proxy 解析; autoCreateTopic 仅为 dev 便利
  rocketmq-broker:
    image: docker.io/apache/rocketmq:5.3.2
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: "${ROCKETMQ_BROKER_HEAP:--Xms512m -Xmx512m -Xmn128m}"
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          'brokerClusterName = DefaultCluster' \
          'brokerName = broker-a' \
          'brokerId = 0' \
          'brokerIP1 = rocketmq-broker' \
          'listenPort = 10911' \
          'autoCreateTopicEnable = true' \
          'autoCreateSubscriptionGroup = true' \
          'flushDiskType = ASYNC_FLUSH' \
          > /tmp/broker.conf
        exec sh mqbroker -n rocketmq-namesrv:9876 -c /tmp/broker.conf
    # 健康语义 = 已在 nameserver 完成注册 (broker JVM 启动需 ~40s, 起完前 proxy 建系统 topic 必失败)
    healthcheck:
      test: ["CMD-SHELL", "JAVA_OPT_EXT='-Xms128m -Xmx128m' sh mqadmin clusterList -n rocketmq-namesrv:9876 2>/dev/null | grep -q broker-a"]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 30s
    depends_on:
      - rocketmq-namesrv

  rocketmq-proxy:
    image: docker.io/apache/rocketmq:5.3.2
    command: sh mqproxy -n rocketmq-namesrv:9876
    environment:
      JAVA_OPT_EXT: "${ROCKETMQ_PROXY_HEAP:--Xms512m -Xmx512m -Xmn128m}"
    restart: unless-stopped
    ports:
      - "${ROCKETMQ_PROXY_PORT:-8081}:8081"
    depends_on:
      rocketmq-broker:
        condition: service_healthy

  # topic 预建 (一次性): autoCreateTopicEnable 只在发布时兜底, 消费者起手拉路由需要 topic 先存在
  rocketmq-topics:
    image: docker.io/apache/rocketmq:5.3.2
    restart: "no"
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m"
    command:
      - sh
      - -c
      - |
        for t in ${MQ_TOPICS:-job-task job-result}; do
          sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t "$$t"
        done
        echo topics ready
    depends_on:
      rocketmq-broker:
        condition: service_healthy

  # ---- 日志栈: fluent-bit -> vector -> clickhouse (db_logs.logs) + grafana 查询 ----
  # 接入: 文件日志放 $LOGS_DIR (默认 ./data/fluent-bit, *.log 含一级子目录) 或 HTTP 直推 $VECTOR_HTTP_PORT (JSON 行).
  # 分组内契约 (硬编码勿 env 化): 库 db_logs / 表 logs / fluent 24224 / ch 8123; 配置文件在 conf/ (bind mount).
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3
    restart: unless-stopped
    ulimits:
      nofile: 262144
    environment:
      CLICKHOUSE_DB: db_logs                          # 仅首次建卷生效 (账号/密码同); 通用账号 admin
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?请在同目录 .env 配置}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"    # HTTP; vector/grafana 走容器网, 此口给宿主 clickhouse-client --url
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"  # native; 宿主 clickhouse-client 直连
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 建库建表 (一次性, 幂等): 按天分区 + TTL $LOG_TTL_DAYS + ZSTD; 改 TTL 对已建表无效需 ALTER
  clickhouse-init:
    image: docker.io/clickhouse/clickhouse-server:26.3
    restart: "no"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?请在同目录 .env 配置}
      LOG_TTL_DAYS: ${LOG_TTL_DAYS:-30}
    command:
      - sh
      - -c
      - |
        sed "s/__TTL_DAYS__/$${LOG_TTL_DAYS:-30}/" /init.sql \
          | clickhouse-client -h clickhouse --user "$${CLICKHOUSE_USER:-admin}" --password "$$CLICKHOUSE_PASSWORD" --multiquery
        echo logs table ready
    volumes:
      - ./conf/clickhouse-init.sql:/init.sql:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  # 日志网关: fluent 24224 + http 8686 + otlp 4317/4318 三入口 -> VRL 清洗 -> 攒批 (1000条/1s, gzip) 写 clickhouse
  # 配置进程内 sed 注入凭据 (conf/vector.toml 占位符; vector env 插值默认禁用; 密码避开 | 字符)
  vector:
    image: docker.io/timberio/vector:0.58.0-debian
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        sed -e "s|__CLICKHOUSE_USER__|$${CLICKHOUSE_USER}|" \
            -e "s|__CLICKHOUSE_PASSWORD__|$${CLICKHOUSE_PASSWORD}|" \
            /etc/vector/vector.tpl > /etc/vector/vector.toml
        exec vector --config /etc/vector/vector.toml
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?请在同目录 .env 配置}
    ports:
      - "127.0.0.1:${VECTOR_HTTP_PORT:-8686}:8686"
    volumes:
      - ./conf/vector.toml:/etc/vector/vector.tpl:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  # 采集: tail $LOGS_DIR (默认 ./data/fluent-bit, 相对 compose.yaml); 偏移 DB 持久化防重采
  fluent-bit:
    image: docker.io/fluent/fluent-bit:5.0.10
    restart: unless-stopped
    volumes:
      - ${LOGS_DIR:-./data/fluent-bit}:/var/log/apps:ro
      - fluentbit-state:/fluent-bit/tail_db
      - ./conf/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - vector

  # OTLP 遥测网关: OTel SDK 标准接入 (4317 gRPC / 4318 HTTP) -> clickhouse db_logs.otel_logs (表由 exporter 自建)
  # 应用侧: OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:$OTLP_HTTP_PORT (容器间 host.containers.internal)
  otelcol:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.0
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?请在同目录 .env 配置}
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./conf/otelcol.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  # 查询: clickhouse 插件预装 + datasource 自动 provisioning (首启联网); 用 Explore > Logs
  grafana:
    image: docker.io/grafana/grafana:12.1
    restart: unless-stopped
    environment:
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource   # GF_INSTALL_PLUGINS 已弃用
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?请在同目录 .env 配置}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}          # 供 datasource provisioning 插值 ($$CLICKHOUSE_*)
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?请在同目录 .env 配置}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./conf/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/clickhouse.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  # external: 继承自旧 podman 项目的外部卷 (compose 只用不建不删; 换新机器需先迁数据再 up, 否则报卷不存在)
  pg-data:
    name: podman_knowanchor-pg-data
    external: true
  mysql-data:
    name: podman_knowanchor-mysql-data
    external: true
  redis-data:
    name: podman_redis-data
    external: true
  # 日志栈内部卷 (compose 自建, 实际名 work_<key>; mw.sh 卸载语义与 external 卷区分)
  clickhouse-data:
  grafana-data:
  fluentbit-state:
