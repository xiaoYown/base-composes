# 工作中间件聚合 (podman): skillsui-knowanchor + light-kb 本地开发共用一套, 不再分多个 compose 分组.
# 迁自 (应用本体不进本分组, 仍在各自仓库 compose 里跑):
#   - agent-os/skillsui-knowanchor/.deploy/podman/compose.yaml  -> postgres / mysql / redis (原项目名 podman)
# 本组只留轻量通用件; 重型/专用栈已各自迁出独立分组按需启停:
#   日志栈 -> elk/podman (fluent-bit + clickhouse 两容器轻量方案, 见其 PLAN.md)
#   rocketmq -> rocketmq/podman (2026-10-08 迁出, 原 light-kb 本地栈, 容器名仍为 rocketmq-*)
# 数据卷沿用原卷名 (podman_ 前缀是原项目名残留, 为无缝继承旧数据不改名):
#   pg: db_default (knowanchor) + db_light_kb (light-kb) 共用实例
#   mysql: knowanchor 业务库 (db_default), root 免密
# 通用账号: pg / mysql 统一 admin (各项目共用, 密码在同目录 .env); 任何 db_name 一律 db_ 前缀
# 连接方式: 宿主进程 127.0.0.1:<port>; 其他 compose 分组的容器用 host.containers.internal:<port>
#   (分组间服务名不互通; 分组内如本文件注释中 pg_isready 用的都是服务名)
# 密钥只进同目录 .env (不入 git).
# machine 挂载约束 (projects machine 2026-09 实测): 仅 /Users 与 /var/folders 可 bind mount
#   (本分组现无 bind mount 不受影响; 需挂载的新分组注意此约束; 重建 machine 挂载清单会变, 以实测为准)
name: work

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16    # postgres + 预装 pgvector 扩展 (knowanchor pgvector 后端用)
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-127.0.0.1}          # 连接信息随容器自带 (podman exec env 可查); 容器间互连用服务名 postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在同目录 .env 配置}
      POSTGRES_DB: ${POSTGRES_DB:-db_default}    # 仅首次初始化生效; 库内其他库 (如 db_light_kb) 不受影响
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: docker.io/library/mysql:8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_HOST: ${MYSQL_HOST:-127.0.0.1}                # 连接信息随容器自带 (podman exec env 可查); 容器间互连用服务名 mysql
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在同目录 .env 配置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_default}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  # external: 继承自旧 podman 项目的外部卷 (compose 只用不建不删; 换新机器需先迁数据再 up, 否则报卷不存在)
  pg-data:
    name: podman_knowanchor-pg-data
    external: true
  mysql-data:
    name: podman_knowanchor-mysql-data
    external: true
  redis-data:
    name: podman_redis-data
    external: true
